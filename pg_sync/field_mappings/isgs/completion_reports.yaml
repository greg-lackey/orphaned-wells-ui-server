    from_col: open_hole_from
    to_col: open_hole_to
    raw_col: open_hole_interval
  Completion_For_Production::Perforation_Interval:
    from_col: perf_from
    to_col: perf_to
    raw_col: perf_int
  Gun_Perforating_Windows:
    from_col: perf_from
    to_col: perf_to
    raw_col: perf_int
  Interval_Cored:
    from_col: null
    to_col: null
    raw_col: cored_interval
